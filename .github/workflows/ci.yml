name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Build Electron app
        run: pnpm -F @zoffice/desktop build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E smoke tests (Linux xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: Run Playwright E2E smoke tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
